<!DOCTYPE html>
<html>
<head>
    <title>GeoMind Web Assimilation Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 300px;
            background-color: #1e1e1e;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #cy {
            flex-grow: 1;
            height: 100%;
            background-color: #0d0d0d;
        }
        h2 { margin-top: 0; color: #4caf50; }
        label { display: block; margin-top: 15px; font-size: 14px; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; }
        .log-panel {
            margin-top: 20px;
            background-color: #000;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Web Assimilation</h2>
    <label>Seed URL</label>
    <input type="text" id="seed_url" value="https://en.wikipedia.org/wiki/Quantum_mechanics">
    
    <label>Depth</label>
    <input type="number" id="depth" value="1" min="1" max="3">
    
    <label>Finsler Distance Threshold</label>
    <input type="number" id="threshold" value="25.0" step="0.5">
    
    <button onclick="startCrawl()">Inject Seed</button>
    <button onclick="assimilateGraph()" style="background-color: #2196F3; margin-top: 10px;">Assimilate Web Graph to Registry</button>
    
    <div class="log-panel" id="log_output">System Ready.</div>
</div>

<div id="cy"></div>

<script>
    var cy = cytoscape({
        container: document.getElementById('cy'),
        style: [
            {
                selector: 'node',
                style: {
                    'background-color': '#4caf50',
                    'label': 'data(label)',
                    'color': '#fff',
                    'text-outline-color': '#000',
                    'text-outline-width': 2,
                    'font-size': '12px',
                    'width': 'mapData(mass, 0, 1, 20, 80)',
                    'height': 'mapData(mass, 0, 1, 20, 80)'
                }
            },
            {
                selector: 'edge',
                style: {
                    'width': 2,
                    'line-color': '#333',
                    'target-arrow-color': '#333',
                    'target-arrow-shape': 'triangle',
                    'curve-style': 'bezier'
                }
            }
        ],
        layout: { name: 'cose', padding: 50 }
    });

    function log(msg) {
        var el = document.getElementById('log_output');
        el.innerHTML += "<br>> " + msg;
        el.scrollTop = el.scrollHeight;
    }

    function startCrawl() {
        var seed = document.getElementById('seed_url').value;
        var depth = document.getElementById('depth').value;
        var thresh = document.getElementById('threshold').value;
        
        log("Starting crawler on " + seed);
        
        fetch('/start_crawl', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ seed: seed, depth: depth, threshold: thresh })
        }).then(res => res.json()).then(data => {
            log(data.message);
            pollGraph();
        });
    }

    function assimilateGraph() {
        log("Calculating Markov Densities and Assimilating to E8 Registry...");
        fetch('/assimilate', {
            method: 'POST'
        }).then(res => res.json()).then(data => {
            log(data.message);
        }).catch(err => log("Error: " + err));
    }

    function pollGraph() {
        setInterval(() => {
            fetch('/graph_data')
            .then(res => res.json())
            .then(data => {
                if (data && data.nodes) {
                    cy.elements().remove();
                    cy.add(data.nodes);
                    cy.add(data.edges);
                    cy.layout({
                        name: 'cose',
                        animate: true,
                        randomize: false,
                        fit: true
                    }).run();
                }
            });
        }, 3000);
    }
</script>

</body>
</html>
